name: Apply action visibility audit

on:
  push:
    branches:
      - fix/full-action-visibility-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-action-visibility-audit
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          base64 -d action-audit.patch.gz.b64 > /tmp/action-audit.patch.gz
          gunzip -c /tmp/action-audit.patch.gz > /tmp/action-audit.patch
          git apply --check /tmp/action-audit.patch
          git apply /tmp/action-audit.patch
          rm -f action-audit.patch.gz.b64 .github/workflows/apply-action-audit.yml
      - name: Build and commit
        shell: bash
        run: |
          npm ci
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete action visibility and empty-state audit'
          git push
